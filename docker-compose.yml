services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hermes-frontend-dev
    profiles: [dev]
    volumes:
      - .:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3001"
    networks:
      - hermes-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-frontend
    profiles: [prod]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3001"
    networks:
      - hermes-network

networks:
  hermes-network:
    external: true
